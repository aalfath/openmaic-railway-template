# Local test of the Railway setup (not used by Railway): the app built from this
# repo's Dockerfile plus PostgreSQL, with the same variables the template sets.
services:
  openmaic:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:testpassword123@postgres:5432/railway
      ACCESS_CODE: testaccesscode1234567890
      OPENMAIC_SECRET_KEY: testsecretkeytestsecretkey123456
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - openmaic-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railway"]
      interval: 3s
      retries: 20
    volumes:
      - openmaic-pg:/var/lib/postgresql
volumes:
  openmaic-data:
  openmaic-pg:
